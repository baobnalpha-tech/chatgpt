<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <title>Lì Xì May Mắn Đầu Năm</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body {
      font-family: system-ui, sans-serif;
      text-align: center;
      background: #b30000;
      color: #fff;
      margin: 0;
      padding: 0;
    }
    .container {
      padding: 40px 16px;
    }
    .start {
      margin-top: 40px;
      padding: 12px 24px;
      border-radius: 999px;
      border: none;
      background: gold;
      color: #b30000;
      font-weight: bold;
      font-size: 18px;
      cursor: pointer;
    }
    .amount-list {
      margin-top: 24px;
      background: rgba(255,255,255,0.1);
      padding: 16px;
      border-radius: 12px;
      display: inline-block;
      text-align: left;
    }
    .result {
      margin-top: 32px;
      font-size: 24px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 CHÚC MỪNG NĂM MỚI 🌸</h1>
    <p>(Chạm vào màn hình để bắt đầu)</p>

    <button class="start" onclick="randomLiXi()">Mở Lì Xì</button>

    <h2>🧧 VẠN SỰ NHƯ Ý 🧧</h2>
    <h3>⚙️ Cấu Hình Mệnh Giá</h3>
    <div class="amount-list">
      <label><input type="checkbox" value="10000" checked> 10.000 VNĐ</label><br>
      <label><input type="checkbox" value="20000" checked> 20.000 VNĐ</label><br>
      <label><input type="checkbox" value="50000" checked> 50.000 VNĐ</label><br>
      <label><input type="checkbox" value="100000"> 100.000 VNĐ</label><br>
      <label><input type="checkbox" value="200000"> 200.000 VNĐ</label><br>
      <label><input type="checkbox" value="500000"> 500.000 VNĐ</label>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    function randomLiXi() {
      const checkboxes = document.querySelectorAll('.amount-list input[type="checkbox"]:checked');
      if (!checkboxes.length) {
        alert('Vui lòng chọn ít nhất một mệnh giá!');
        return;
      }
      const values = Array.from(checkboxes).map(cb => parseInt(cb.value));
      const randomIndex = Math.floor(Math.random() * values.length);
      const amount = values[randomIndex].toLocaleString('vi-VN');
      const result = document.getElementById('result');
      result.textContent = 'Bạn nhận được: ' + amount + ' VNĐ';
    }

    // Cho phép chạm vào màn hình bất kỳ đâu để mở lì xì
    document.body.addEventListener('click', function(e) {
      // tránh trigger khi bấm vào checkbox
      if (e.target.tagName.toLowerCase() === 'input' || e.target.tagName.toLowerCase() === 'button') return;
      randomLiXi();
    });
  </script>
</body>
</html>
